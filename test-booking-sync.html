<!DOCTYPE html>
<html>
<head>
  <title>🧪 Booking Sync Test</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f1a; color: #eee; padding: 20px; max-width: 900px; margin: 0 auto; }
    h1 { color: #a78bfa; }
    h2 { color: #60a5fa; border-bottom: 1px solid #333; padding-bottom: 8px; margin-top: 30px; }
    .step { background: #1a1a2e; border-radius: 12px; padding: 20px; margin: 15px 0; border-left: 4px solid #4f46e5; }
    .step-num { background: #4f46e5; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; margin-right: 10px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .warning { color: #fbbf24; }
    .info { color: #60a5fa; }
    pre { background: #0a0a15; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
    button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 15px; margin: 5px; }
    button:hover { background: #6366f1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #ef4444; }
    input { background: #1a1a2e; border: 1px solid #333; color: white; padding: 10px 15px; border-radius: 8px; width: 100%; margin: 5px 0; }
    .form-group { margin: 15px 0; }
    label { display: block; margin-bottom: 5px; color: #a78bfa; font-weight: 500; }
    #output { margin-top: 20px; }
    .log-entry { padding: 8px 12px; margin: 4px 0; border-radius: 6px; background: #1a1a2e; }
    .realtime-badge { background: #22c55e; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #1a1a2e; color: #a78bfa; }
    tr:hover { background: #1a1a2e; }
    .status-pending { color: #fbbf24; }
    .status-accepted { color: #4ade80; }
  </style>
</head>
<body>
  <h1>🧪 Booking Sync Test</h1>
  <p>Step-by-step testing to verify bookings sync with your database</p>

  <div id="output"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    
    // Supabase credentials
    const SUPABASE_URL = 'https://sbvrpetwhesnkyyombdf.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNidnJwZXR3aGVzbmt5eW9tYmRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4NTY2NTcsImV4cCI6MjA4NTQzMjY1N30.p22z3jAcjkLvO52gloPrUN0eMeT1drrgLHbu9OruKbs'
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    const output = document.getElementById('output')
    
    let realtimeChannel = null
    let testBookingId = null
    
    function log(message, type = 'info') {
      const entry = document.createElement('div')
      entry.className = `log-entry ${type}`
      entry.innerHTML = `<span class="${type}">${new Date().toLocaleTimeString()}</span> - ${message}`
      output.appendChild(entry)
      output.scrollTop = output.scrollHeight
    }

    function clearOutput() {
      output.innerHTML = ''
    }

    function renderUI() {
      output.innerHTML = `
        <div class="step">
          <h2><span class="step-num">1</span> Test Database Connection</h2>
          <p>First, verify that Supabase is reachable and the bookings table exists.</p>
          <button id="btn-test-connection">🔌 Test Connection</button>
          <div id="connection-result"></div>
        </div>

        <div class="step">
          <h2><span class="step-num">2</span> Create Test Booking</h2>
          <p>Insert a test booking to verify write permissions.</p>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="test-name" value="Test User" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="test-email" value="test@example.com" />
          </div>
          <div class="form-group">
            <label>Project Type</label>
            <input type="text" id="test-project" value="Website Development" />
          </div>
          <button id="btn-create-booking">📝 Create Test Booking</button>
          <div id="create-result"></div>
        </div>

        <div class="step">
          <h2><span class="step-num">3</span> Verify Booking in Database</h2>
          <p>Read back the booking to confirm it was saved.</p>
          <button id="btn-verify-booking">🔍 Verify Booking</button>
          <div id="verify-result"></div>
        </div>

        <div class="step">
          <h2><span class="step-num">4</span> Test Realtime Subscription</h2>
          <p>Subscribe to realtime changes and test live updates.</p>
          <button id="btn-start-realtime">📡 Start Realtime Listener</button>
          <button id="btn-trigger-update" disabled>🔄 Trigger Update (changes status)</button>
          <div id="realtime-result"></div>
        </div>

        <div class="step">
          <h2><span class="step-num">5</span> View All Bookings</h2>
          <p>Display all bookings currently in the database.</p>
          <button id="btn-load-bookings">📋 Load All Bookings</button>
          <button id="btn-cleanup" class="danger">🗑️ Delete Test Booking</button>
          <div id="bookings-result"></div>
        </div>

        <div class="step">
          <h2>📜 Activity Log</h2>
          <div id="activity-log" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
      `

      // Attach event handlers
      document.getElementById('btn-test-connection').onclick = testConnection
      document.getElementById('btn-create-booking').onclick = createTestBooking
      document.getElementById('btn-verify-booking').onclick = verifyBooking
      document.getElementById('btn-start-realtime').onclick = startRealtime
      document.getElementById('btn-trigger-update').onclick = triggerUpdate
      document.getElementById('btn-load-bookings').onclick = loadAllBookings
      document.getElementById('btn-cleanup').onclick = cleanupTestBooking
    }

    function logActivity(message, type = 'info') {
      const logContainer = document.getElementById('activity-log')
      if (!logContainer) return
      const entry = document.createElement('div')
      entry.className = `log-entry`
      entry.innerHTML = `<span class="${type}">[${new Date().toLocaleTimeString()}]</span> ${message}`
      logContainer.appendChild(entry)
      logContainer.scrollTop = logContainer.scrollHeight
    }

    // Step 1: Test Connection
    async function testConnection() {
      const resultDiv = document.getElementById('connection-result')
      resultDiv.innerHTML = '<p class="info">⏳ Testing connection...</p>'
      
      try {
        const { data, error, count } = await supabase
          .from('bookings')
          .select('*', { count: 'exact', head: true })
        
        if (error) {
          if (error.code === '42P01') {
            resultDiv.innerHTML = `<p class="error">❌ Table "bookings" does not exist. Run this SQL in Supabase:</p>
              <pre>CREATE TABLE IF NOT EXISTS bookings (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  name TEXT,
  email TEXT,
  phone TEXT,
  project_type TEXT,
  notes TEXT,
  meeting_date DATE,
  meeting_time TIME,
  status TEXT DEFAULT 'pending',
  created_at TIMESTAMPTZ DEFAULT NOW()
);

ALTER TABLE bookings ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Allow public inserts" ON bookings FOR INSERT WITH CHECK (true);
CREATE POLICY "Allow public reads" ON bookings FOR SELECT USING (true);</pre>`
          } else {
            resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`
          }
          logActivity('Connection test failed: ' + error.message, 'error')
          return
        }
        
        resultDiv.innerHTML = `<p class="success">✅ Connected successfully! Bookings table exists with ${count ?? 0} rows.</p>`
        logActivity('Connection test passed!', 'success')
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">❌ Connection failed: ${err.message}</p>`
        logActivity('Connection error: ' + err.message, 'error')
      }
    }

    // Step 2: Create Test Booking
    async function createTestBooking() {
      const resultDiv = document.getElementById('create-result')
      resultDiv.innerHTML = '<p class="info">⏳ Creating booking...</p>'
      
      const name = document.getElementById('test-name').value
      const email = document.getElementById('test-email').value
      const projectType = document.getElementById('test-project').value
      
      try {
        const { data, error } = await supabase
          .from('bookings')
          .insert({
            name,
            email,
            project_type: projectType,
            notes: 'Test booking from sync test page',
            meeting_date: new Date().toISOString().split('T')[0],
            meeting_time: '10:00',
            status: 'pending'
          })
          .select()
          .single()
        
        if (error) {
          resultDiv.innerHTML = `<p class="error">❌ Insert failed: ${error.message}</p>
            <p class="warning">If RLS error, run this SQL:</p>
            <pre>CREATE POLICY "Allow public inserts" ON bookings FOR INSERT WITH CHECK (true);</pre>`
          logActivity('Booking creation failed: ' + error.message, 'error')
          return
        }
        
        testBookingId = data.id
        resultDiv.innerHTML = `<p class="success">✅ Booking created!</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
          <p class="info">Booking ID: ${testBookingId}</p>`
        logActivity('Booking created with ID: ' + testBookingId, 'success')
        
        // Enable trigger update button
        document.getElementById('btn-trigger-update').disabled = false
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`
        logActivity('Booking creation error: ' + err.message, 'error')
      }
    }

    // Step 3: Verify Booking
    async function verifyBooking() {
      const resultDiv = document.getElementById('verify-result')
      
      if (!testBookingId) {
        resultDiv.innerHTML = '<p class="warning">⚠️ Create a test booking first (Step 2)</p>'
        return
      }
      
      resultDiv.innerHTML = '<p class="info">⏳ Verifying...</p>'
      
      try {
        const { data, error } = await supabase
          .from('bookings')
          .select('*')
          .eq('id', testBookingId)
          .single()
        
        if (error) {
          resultDiv.innerHTML = `<p class="error">❌ Read failed: ${error.message}</p>
            <p class="warning">If permission error, run:</p>
            <pre>CREATE POLICY "Allow public reads" ON bookings FOR SELECT USING (true);</pre>`
          logActivity('Verification failed: ' + error.message, 'error')
          return
        }
        
        resultDiv.innerHTML = `<p class="success">✅ Booking verified in database!</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>`
        logActivity('Booking verified successfully', 'success')
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">❌ Error: ${err.message}</p>`
      }
    }

    // Step 4: Realtime
    async function startRealtime() {
      const resultDiv = document.getElementById('realtime-result')
      const btn = document.getElementById('btn-start-realtime')
      
      if (realtimeChannel) {
        await supabase.removeChannel(realtimeChannel)
        realtimeChannel = null
        btn.textContent = '📡 Start Realtime Listener'
        resultDiv.innerHTML = '<p class="warning">⏹️ Realtime listener stopped</p>'
        logActivity('Realtime listener stopped', 'warning')
        return
      }
      
      resultDiv.innerHTML = '<p class="info">⏳ Starting realtime subscription...</p>'
      
      try {
        realtimeChannel = supabase.channel('bookings-changes')
          .on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'bookings' 
          }, (payload) => {
            const eventType = payload.eventType.toUpperCase()
            const data = payload.new || payload.old
            logActivity(`🔔 REALTIME ${eventType}: ${JSON.stringify(data)}`, 'success')
            
            resultDiv.innerHTML = `<p class="success"><span class="realtime-badge">LIVE</span> Last event: ${eventType}</p>
              <pre>${JSON.stringify(payload, null, 2)}</pre>`
          })
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
              resultDiv.innerHTML = `<p class="success"><span class="realtime-badge">LIVE</span> Realtime active! Waiting for changes...</p>
                <p class="info">Try updating a booking or use "Trigger Update" button</p>`
              logActivity('Realtime subscription active', 'success')
              btn.textContent = '⏹️ Stop Realtime Listener'
            } else {
              resultDiv.innerHTML = `<p class="warning">Status: ${status}</p>`
              logActivity('Realtime status: ' + status, 'warning')
            }
          })
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">❌ Realtime error: ${err.message}</p>
          <p class="warning">Make sure Realtime is enabled for bookings table in Supabase Dashboard → Database → Replication</p>`
        logActivity('Realtime error: ' + err.message, 'error')
      }
    }

    // Trigger Update
    async function triggerUpdate() {
      if (!testBookingId) {
        alert('Create a test booking first!')
        return
      }
      
      const newStatus = Math.random() > 0.5 ? 'accepted' : 'pending'
      logActivity(`Updating booking status to "${newStatus}"...`, 'info')
      
      const { error } = await supabase
        .from('bookings')
        .update({ status: newStatus, notes: 'Updated at ' + new Date().toISOString() })
        .eq('id', testBookingId)
      
      if (error) {
        logActivity('Update failed: ' + error.message, 'error')
      } else {
        logActivity('Update sent! Check realtime listener for event.', 'success')
      }
    }

    // Step 5: Load All Bookings
    async function loadAllBookings() {
      const resultDiv = document.getElementById('bookings-result')
      resultDiv.innerHTML = '<p class="info">⏳ Loading bookings...</p>'
      
      try {
        const { data, error } = await supabase
          .from('bookings')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(20)
        
        if (error) {
          resultDiv.innerHTML = `<p class="error">❌ ${error.message}</p>`
          return
        }
        
        if (!data || data.length === 0) {
          resultDiv.innerHTML = '<p class="warning">No bookings found</p>'
          return
        }
        
        let tableHtml = `<table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Project</th>
              <th>Date</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody>`
        
        data.forEach(b => {
          tableHtml += `
            <tr>
              <td>${b.name || '-'}</td>
              <td>${b.email || '-'}</td>
              <td>${b.project_type || '-'}</td>
              <td>${b.meeting_date || '-'}</td>
              <td class="status-${b.status}">${b.status || '-'}</td>
              <td>${b.created_at ? new Date(b.created_at).toLocaleString() : '-'}</td>
            </tr>`
        })
        
        tableHtml += '</tbody></table>'
        resultDiv.innerHTML = `<p class="success">✅ Found ${data.length} bookings</p>${tableHtml}`
        logActivity(`Loaded ${data.length} bookings`, 'success')
      } catch (err) {
        resultDiv.innerHTML = `<p class="error">❌ ${err.message}</p>`
      }
    }

    // Cleanup
    async function cleanupTestBooking() {
      if (!testBookingId) {
        alert('No test booking to delete')
        return
      }
      
      if (!confirm('Delete the test booking?')) return
      
      const { error } = await supabase
        .from('bookings')
        .delete()
        .eq('id', testBookingId)
      
      if (error) {
        logActivity('Delete failed: ' + error.message, 'error')
        alert('Delete failed: ' + error.message)
      } else {
        logActivity('Test booking deleted', 'success')
        testBookingId = null
        document.getElementById('btn-trigger-update').disabled = true
        loadAllBookings()
      }
    }

    // Initialize
    renderUI()
    logActivity('Test page loaded. Ready to test booking sync.', 'info')
  </script>
</body>
</html>
